name: Post alerts to X

on:
  schedule:
    # Every 5 minutes. This is the shortest schedule that GitHub allows.
    # Each scheduled run checks the feed 3 times, 2 minutes apart.
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "dry-run prints the posts. post sends them to IFTTT, which posts them to X."
        type: choice
        options:
          - dry-run
          - post
        default: dry-run
      backfill:
        description: "First live run only: also post this number of the newest alerts."
        type: string
        default: "0"
      resend:
        description: "Send again the alerts with this text in the title. Leave empty for a normal run."
        type: string
        default: ""

permissions:
  contents: write   # the job saves state.json to the repo

# One run at a time, so that two runs never post the same alert.
concurrency:
  group: post-alerts
  cancel-in-progress: false

jobs:
  post:
    # A scheduled run does nothing until the repository variable
    # POSTING_ENABLED is set to "true". A manual run always works.
    if: github.event_name != 'schedule' || vars.POSTING_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7

      - name: Run the bot
        env:
          EVENT: ${{ github.event_name }}
          MODE: ${{ inputs.mode }}
          BACKFILL: ${{ inputs.backfill }}
          RESEND: ${{ inputs.resend }}
          IFTTT_WEBHOOK_KEY: ${{ secrets.IFTTT_WEBHOOK_KEY }}
          IFTTT_EVENT: ${{ vars.IFTTT_EVENT }}
          MAX_POST_CHARS: ${{ vars.MAX_POST_CHARS }}
        run: |
          # Save the record of sent alerts to the repo after each check, so
          # that an alert is not sent again if a later step fails.
          save_state() {
            if [ -n "$(git status --porcelain state.json)" ]; then
              git config user.name "github-actions[bot]"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
              git add state.json
              git commit -q -m "Record posted alerts"
              git push -q
            fi
          }
          rc=0
          if [ "$EVENT" = "schedule" ]; then
            for check in 1 2 3; do
              python3 bot.py --post || rc=$?
              save_state
              if [ "$check" -lt 3 ]; then sleep 120; fi
            done
          else
            args=()
            if [ "$MODE" = "post" ]; then
              args+=(--post)
            fi
            if [[ "$BACKFILL" =~ ^[0-9]+$ ]] && [ "$BACKFILL" -gt 0 ]; then
              args+=(--backfill "$BACKFILL")
            fi
            if [ -n "$RESEND" ]; then
              args+=(--resend "$RESEND")
            fi
            python3 bot.py "${args[@]}" || rc=$?
            save_state
          fi
          exit $rc
