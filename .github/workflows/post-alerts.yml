name: Post alerts to X

on:
  schedule:
    # Every 5 minutes, at minutes 3, 8, 13 and so on. This is the shortest
    # schedule that GitHub allows. No run starts on the hour, because GitHub
    # delays or drops scheduled runs most often then.
    # Each scheduled run checks the feed 3 times, 2 minutes apart.
    # GitHub did not start these scheduled runs for this repo (November 2026).
    # For that reason each run starts the next run (see "Start the next run").
    # The schedule stays as a second way to start the chain.
    - cron: "3/5 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "dry-run prints the posts. post sends them once. watch does the same as a scheduled run and then starts the next run."
        type: choice
        options:
          - dry-run
          - post
          - watch
        default: dry-run
      backfill:
        description: "First live run only: also post this number of the newest alerts."
        type: string
        default: "0"
      resend:
        description: "Send again the alerts with this text in the title. Leave empty for a normal run."
        type: string
        default: ""

permissions:
  contents: write   # the job saves state.json to the repo
  actions: write    # the job starts the next run

# One run at a time, so that two runs never post the same alert.
concurrency:
  group: post-alerts
  cancel-in-progress: false

jobs:
  post:
    # A scheduled run or a watch run does nothing until the repository
    # variable POSTING_ENABLED is set to "true". A manual dry-run or post run
    # always works.
    if: (github.event_name == 'workflow_dispatch' && inputs.mode != 'watch') || vars.POSTING_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7

      - name: Run the bot
        env:
          EVENT: ${{ github.event_name }}
          MODE: ${{ inputs.mode }}
          BACKFILL: ${{ inputs.backfill }}
          RESEND: ${{ inputs.resend }}
          IFTTT_WEBHOOK_KEY: ${{ secrets.IFTTT_WEBHOOK_KEY }}
          IFTTT_EVENT: ${{ vars.IFTTT_EVENT }}
          MIN_SCORE: ${{ vars.MIN_SCORE }}
        run: |
          # Save the record of sent alerts to the repo after each check, so
          # that an alert is not sent again if a later step fails.
          save_state() {
            if [ -n "$(git status --porcelain state.json)" ]; then
              git config user.name "github-actions[bot]"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
              git add state.json
              git commit -q -m "Record posted alerts"
              git push -q
            fi
          }
          rc=0
          if [ "$EVENT" = "schedule" ] || [ "$MODE" = "watch" ]; then
            for check in 1 2 3; do
              python3 bot.py --post || rc=$?
              save_state
              if [ "$check" -lt 3 ]; then sleep 120; fi
            done
          else
            args=()
            if [ "$MODE" = "post" ]; then
              args+=(--post)
            fi
            if [[ "$BACKFILL" =~ ^[0-9]+$ ]] && [ "$BACKFILL" -gt 0 ]; then
              args+=(--backfill "$BACKFILL")
            fi
            if [ -n "$RESEND" ]; then
              args+=(--resend "$RESEND")
            fi
            python3 bot.py "${args[@]}" || rc=$?
            save_state
          fi
          exit $rc

      - name: Start the next run
        # A scheduled run or a watch run starts the next watch run, also when
        # a check failed. To stop the chain, cancel the run that is in
        # progress, or delete the variable POSTING_ENABLED.
        if: ${{ !cancelled() && (github.event_name == 'schedule' || inputs.mode == 'watch') && vars.POSTING_ENABLED == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for try in 1 2 3; do
            if gh workflow run post-alerts.yml --repo "$GITHUB_REPOSITORY" --ref main -f mode=watch; then
              exit 0
            fi
            sleep 10
          done
          echo "Could not start the next run. Start one by hand with mode watch."
          exit 1
