<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 558" width="680" role="img" aria-labelledby="title desc">
  <title id="title">How the Infosec Live X bot works</title>
  <desc id="desc">GitHub Actions runs bot.py every 5 minutes. The script reads the Infosec Live RSS feed, checks state.json for the alerts it has already sent, and sends each new post to an IFTTT Applet. The Applet posts it to the X account.</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .th { font-size: 14px; font-weight: 600; fill: #2C2C2A; }
    .ts { font-size: 12px; fill: #5F5E5A; }
    .box { fill: #F6F5F1; stroke: #B4B2A9; stroke-width: 1; }
    .own { fill: #EEEDFE; stroke: #534AB7; stroke-width: 1; }
    .own-th { font-size: 14px; font-weight: 600; fill: #3C3489; }
    .own-ts { font-size: 12px; fill: #534AB7; }
    .arr { stroke: #5F5E5A; stroke-width: 1.5; fill: none; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect x="0.5" y="0.5" width="679" height="557" rx="12" fill="#FFFFFF" stroke="#D0D7DE"/>

  <rect class="box" x="210" y="40" width="260" height="56" rx="8"/>
  <text class="th" x="340" y="58" text-anchor="middle" dominant-baseline="central">Infosec Live RSS feed</text>
  <text class="ts" x="340" y="78" text-anchor="middle" dominant-baseline="central">Newest 50 alerts</text>

  <rect x="40" y="140" width="600" height="146" rx="8" fill="none" stroke="#888780" stroke-width="1" stroke-dasharray="4 4"/>
  <text class="th" x="60" y="164" dominant-baseline="central">GitHub Actions</text>
  <text class="ts" x="60" y="184" dominant-baseline="central">Runs every 5 minutes</text>

  <line class="arr" x1="340" y1="96" x2="340" y2="196" marker-end="url(#arrow)"/>

  <rect class="own" x="220" y="200" width="240" height="56" rx="8"/>
  <text class="own-th" x="340" y="218" text-anchor="middle" dominant-baseline="central">bot.py</text>
  <text class="own-ts" x="340" y="238" text-anchor="middle" dominant-baseline="central">Builds the post</text>

  <line class="arr" x1="464" y1="228" x2="486" y2="228" marker-start="url(#arrow)" marker-end="url(#arrow)"/>

  <rect class="own" x="490" y="200" width="130" height="56" rx="8"/>
  <text class="own-th" x="555" y="218" text-anchor="middle" dominant-baseline="central">state.json</text>
  <text class="own-ts" x="555" y="238" text-anchor="middle" dominant-baseline="central">Sent alerts</text>

  <line class="arr" x1="340" y1="256" x2="340" y2="342" marker-end="url(#arrow)"/>

  <rect class="box" x="210" y="346" width="260" height="56" rx="8"/>
  <text class="th" x="340" y="364" text-anchor="middle" dominant-baseline="central">IFTTT Applet</text>
  <text class="ts" x="340" y="384" text-anchor="middle" dominant-baseline="central">Webhook in, post out</text>

  <line class="arr" x1="340" y1="402" x2="340" y2="458" marker-end="url(#arrow)"/>

  <rect class="box" x="210" y="462" width="260" height="56" rx="8"/>
  <text class="th" x="340" y="480" text-anchor="middle" dominant-baseline="central">@infoseclivebot on X</text>
  <text class="ts" x="340" y="500" text-anchor="middle" dominant-baseline="central">One post per alert</text>
</svg>
